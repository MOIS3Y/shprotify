[package]
name = "shprotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Self-hosted music server with a headless HTTP API"
license = "GPL-3.0-only"
keywords = ["audio", "music", "self-hosted", "server", "streaming"]
categories = ["multimedia::audio", "web-programming::http-server"]
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive", "env"] }
console = "0.16.6"
figment = { package = "figment2", version = "0.11.5", features = ["env", "toml"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
