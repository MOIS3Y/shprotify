[package]
name = "shprotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Self-hosted music server with a headless HTTP API"
license = "GPL-3.0-only"
keywords = ["audio", "music", "self-hosted", "server", "streaming"]
categories = ["multimedia::audio", "web-programming::http-server"]
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["zeroize"] }
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive", "env"] }
console = "0.16.6"
getrandom = "0.4.3"
indicatif = "0.18.6"
lofty = "0.25.5"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
zeroize = "1.9.2"

[dependencies.figment]
package = "figment2"
version = "0.11.5"
features = ["env", "toml"]

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["jpeg", "png"]

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["form", "json", "query", "rustls"]

[dependencies.sqlx]
version = "0.9.1"
default-features = false
features = ["json", "macros", "migrate", "runtime-tokio", "sqlite"]

[dependencies.tokio]
version = "1.54.1"
features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
]

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
