services:
  shprotify:
    image: ${SHPROTIFY_IMAGE:-ghcr.io/mois3y/shprotify:latest}
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      SHPROTIFY_HTTP__BIND: "0.0.0.0:3000"
      SHPROTIFY_DATABASE__PATH: "/data/shprotify.db"
      SHPROTIFY_LIBRARY__DIRECTORIES: '["/music"]'
      SHPROTIFY_LIBRARY__PUBLIC_CATALOG: "false"
      SHPROTIFY_DOWNLOADS__DIRECTORY: "/data/downloads"
      SHPROTIFY_LOGGING__FORMAT: "json"
      SHPROTIFY_DOCS__ENABLED: "true"
    volumes:
      - ./data:/data
      - ./music:/music:ro
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.shprotify.rule: "Host(`music.example.org`)"
      traefik.http.routers.shprotify.entrypoints: "websecure"
      traefik.http.routers.shprotify.tls: "true"
      traefik.http.routers.shprotify.tls.certresolver: "letsencrypt"
      traefik.http.services.shprotify.loadbalancer.server.port: "3000"

networks:
  proxy:
    external: true
