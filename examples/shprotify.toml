# Complete example of all currently supported configuration settings.
# Copy examples/shprotify.toml to dev/shprotify.toml and run:
# cargo run -- --config dev/shprotify.toml
# Without --config, only defaults and environment variables are used.
# Override nested keys with SHPROTIFY_ and __, for example:
# SHPROTIFY_HTTP__BIND=127.0.0.1:8080

[http]
# GET /api/v1/health reports liveness. SIGINT/SIGTERM stop the server.
bind = "127.0.0.1:3000"

[auth]
# Lifetime of new password sessions in seconds; default: 30 days.
# Positive integer, 1..4294967295. Activity does not extend the lifetime.
# Restart to apply changes. Existing sessions keep their stored expiry.
# Personal API keys do not expire and are unaffected by this setting.
# Environment: SHPROTIFY_AUTH__SESSION_TTL_SECONDS=86400 (one day).
session_ttl_seconds = 2592000

[database]
# Relative to the working directory, not to this configuration file.
# Parent directory must exist; the database file is created if missing.
# Uses WAL, foreign keys, and a 5-second write-lock wait (pool: 1–5).
path = "dev/shprotify.db"

[library]
# Existing readable directories, relative to the working directory or absolute.
# Files are never moved, renamed, or modified.
# Startup resolves symlinks and rejects duplicate or overlapping roots.
# Read tags/properties: cargo run -- --config dev/shprotify.toml scan
# Scan writes JSON Lines to stdout; logs go to stderr. It does not open the DB.
# Nested symlinks are skipped. File errors are reported; exit status is nonzero.
# Scanning is explicit; normal server startup only validates these roots.
# POST /api/v1/library/scans starts background indexing into the catalog.
# Unchanged files are skipped; add ?force=true to reread all source metadata.
# Existing paths keep their recording; measured properties/tags are refreshed.
# New files match artist/release tags within their immediate parent directory.
# See examples/scan.md for the import policy and persisted job reports.
directories = []
# Example: directories = ["dev/music", "/mnt/music archive"]
# Environment: SHPROTIFY_LIBRARY__DIRECTORIES='["/srv/music", "/mnt/archive"]'

[logging]
# Minimum severity: trace, debug, info, warn, error. RUST_LOG is not used.
level = "info"
# stderr output: pretty (terminal colors when available), json.
format = "pretty"

[docs]
# Publish /docs and /openapi.json. Both are absent when disabled.
# Change requires a restart; override with SHPROTIFY_DOCS__ENABLED=true.
enabled = false

[metadata]
# Explicit admin jobs only; normal scans never contact external services.
# Changes require a restart. Embedded art and manual edits work when disabled.
enabled = false
# Required when enabled: identify this app/version and an operator contact.
# Example: "shprotify/0.1.0 (mailto:operator@example.org)"
user_agent = ""
# Optional AcoustID application key; never use a user submission key here.
# Prefer SHPROTIFY_METADATA__ACOUSTID_KEY to a shared configuration file.
acoustid_key = ""
# Optional Chromaprint executable; install fpcalc separately to identify audio.
# Example: "/run/current-system/sw/bin/fpcalc". Empty disables execution.
fpcalc_path = ""

[discovery]
# Local recommendations, profiles and feedback work without external services.
# Enabling adapters allows explicit personal refresh jobs to contact providers.
enabled = false
# Application identity and operator contact; required when enabled.
# Example: "shprotify/0.1.0 (mailto:operator@example.org)"
user_agent = ""
# Last.fm application API key, not a user's password/session/scrobbling key.
# Environment: SHPROTIFY_DISCOVERY__LASTFM_API_KEY=...
lastfm_api_key = ""
# Public playlist search/import only; no ListenBrainz user token is required.
listenbrainz_enabled = false
# Recent-release metadata for exact artist MBIDs; separate from metadata jobs.
musicbrainz_enabled = false
# Public normalized response cache: 60..86400 seconds. Keys are never cached.
cache_ttl_seconds = 3600
# Per-account accepted-refresh interval: 1..3600 seconds; global worker limit 1.
refresh_interval_seconds = 60

[downloads]
# Experimental acquisition for any authenticated member/admin, off by default.
# Provider failures affect only their jobs. See examples/downloads.md.
enabled = false
# Exclusive server-owned storage, separate from library.directories.
# Empty means no managed storage. Set to "dev/downloads" for local development.
# Created with mode 0700; existing directories must already be private.
# Keep configured to stream existing imports even when downloads are disabled.
directory = ""
# Concurrent searches/downloads/verifications/imports: 1..4.
max_parallel_jobs = 2
# Global queued + active jobs: 1..100; per account: 1..10.
max_pending_jobs = 20
max_user_jobs = 3
# Maximum encoded audio size: 1 MiB..1 GiB. Remuxing can use twice this space.
max_file_bytes = 268435456
# Provider download timeout: 30..1800 seconds. Source searches time out at 60 s.
timeout_seconds = 600
# Maximum track/source duration: 1..14400 seconds. No live streams.
max_duration_seconds = 1800
# Per-account source-search cooldown: 1..300 seconds.
request_interval_seconds = 5

[downloads.youtube]
# Unstable external source: no availability guarantee; explicit source choice.
# Both downloads.enabled and this switch must be true to accept new jobs.
enabled = false
# Nix package/dev shell supplies these tools. Trusted server paths only.
# yt-dlp must include yt-dlp-ejs. No runtime self-updates or script downloads.
yt_dlp_path = "yt-dlp"
ffmpeg_path = "ffmpeg"
deno_path = "deno"
